server:
  port: 8080

spring:
  application:
    name: brightloop-subscription-platform
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/brightloop_db
    username: brightloop
    password: brightloop_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Application specific properties
app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    access-token-expiration-ms: 900000    # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  ollama:
    base-url: "http://localhost:11434"
    model: "qwen2.5:3b"
    timeout-ms: 5000
